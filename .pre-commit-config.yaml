# Pre-commit hooks for jbaruch/koog-plugin
#
# Required by jbaruch/coding-policy: no-secrets — blocks commits that contain
# secret-like patterns before they land on a branch.
#
# Install once per clone:
#   pip install pre-commit
#   pre-commit install
#
# Run manually across the whole repo:
#   pre-commit run --all-files

repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks
        name: gitleaks — scan staged content for secrets

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
