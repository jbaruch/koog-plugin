name: Verify Published Examples

on:
  pull_request:
    paths:
      - 'skills/**'
      - 'rules/**'
      - 'evals/**'
      - 'tests/**'
      - '.github/workflows/examples.yml'
  push:
    branches: [main]
    paths:
      - 'skills/**'
      - 'rules/**'
      - 'evals/**'
      - 'tests/**'
      - '.github/workflows/examples.yml'

permissions:
  contents: read

jobs:
  examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21.0.12+101.0.LTS' # Review Temurin security builds monthly.
      - uses: gradle/actions/setup-gradle@4c125117fe7c5aed11272ec4213f602f012f89f2 # v5
        with:
          gradle-version: '9.2.1'
      - name: Check Kotlin formatting
        run: gradle -p tests/examples ktlintCheck --no-daemon
      - name: Compile examples and test behavior
        run: gradle -p tests/examples check --no-daemon
