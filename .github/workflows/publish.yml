name: Publish Plugin

# Thin caller for the canonical fleet publish pipeline
# (jbaruch/coding-policy#206). publish-mode: as-is keeps koog's deliberate
# no-auto-bump contract (`tessl plugin publish` of the manifest version;
# a missing human bump surfaces as a red "version exists" run). Display name
# and the plugin-content path filter are preserved.

on:
  push:
    branches: [main]
    # Only fire when plugin-content paths change (mirrors the published payload).
    paths:
      - 'rules/**'
      - 'skills/**'
      - 'evals/**'
      - '.tessl-plugin/plugin.json'
      - 'README.md'
      - 'CHANGELOG.md'
      - '.tesslignore'
  workflow_dispatch:

# Must grant at least what the reusable workflow declares (contents: write,
# id-token: write). A called workflow cannot exceed the caller's grant, and
# capping this at `contents: read` fails the whole run at startup before any
# job begins — no logs, no jobs, just a red run.
permissions:
  contents: write
  id-token: write

jobs:
  publish:
    uses: jbaruch/coding-policy/.github/workflows/publish-plugin.yml@e9ba7b27c8e7db9c67a29ccc685b1824a0caeb7a
    secrets:
      TESSL_TOKEN: ${{ secrets.TESSL_TOKEN }}
    with:
      publish-mode: as-is
      skill-review-credit-outage: skip
      # The jbaruch workspace is out of eval credits, so a publish that also
      # uploads scenarios lands the artifact and then fails on the eval run.
      # Consumers get the version from here; the eval numbers come from a
      # private copy published under a workspace that has credit, and land in
      # the CHANGELOG. Flip back to false when jbaruch has credit again.
      skip-evals: true
